<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物提醒</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }
        
        .reminder-container {
            width: 350px;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .reminder-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .reminder-icon {
            font-size: 32px;
            margin-right: 15px;
            animation: bounce 1s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .reminder-title {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        
        .reminder-message {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        
        .reminder-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        
        .btn-primary:hover {
            background: white;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="reminder-container">
        <button class="close-btn" id="closeBtn">×</button>
        
        <div class="reminder-header">
            <div class="reminder-icon" id="reminderIcon">💧</div>
            <h3 class="reminder-title" id="reminderTitle">喝水提醒</h3>
        </div>
        
        <div class="reminder-message" id="reminderMessage">
            该喝水了！保持身体水分充足对健康很重要哦～
        </div>
        
        <div class="reminder-buttons">
            <button class="btn btn-secondary" id="delayBtn">稍后提醒</button>
            <button class="btn btn-primary" id="doneBtn">知道了</button>
        </div>
    </div>
    
    <script src="reminder.js"></script>
</body>
</html>
