<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Pet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="pet-container">
        <div id="pet" class="pet-idle">
            <!-- 小猫 SVG -->
            <svg id="cat-pet" class="pet-svg pet-cat" viewBox="0 0 120 120" style="display: none;">
                <!-- 身体 -->
                <ellipse cx="60" cy="75" rx="35" ry="30" fill="#ff6b6b" class="pet-body-svg"/>
                <!-- 头部 -->
                <circle cx="60" cy="45" r="25" fill="#ff6b6b" class="pet-head"/>
                <!-- 耳朵 -->
                <polygon points="40,25 35,10 50,20" fill="#ff6b6b" class="ear left-ear"/>
                <polygon points="80,25 85,10 70,20" fill="#ff6b6b" class="ear right-ear"/>
                <polygon points="42,22 40,15 47,18" fill="#ff9999" class="ear-inner left-ear-inner"/>
                <polygon points="78,22 80,15 73,18" fill="#ff9999" class="ear-inner right-ear-inner"/>
                <!-- 眼睛 -->
                <ellipse cx="52" cy="40" rx="4" ry="6" fill="#333" class="eye left-eye"/>
                <ellipse cx="68" cy="40" rx="4" ry="6" fill="#333" class="eye right-eye"/>
                <ellipse cx="53" cy="38" rx="1.5" ry="2" fill="#fff" class="eye-shine left-shine"/>
                <ellipse cx="69" cy="38" rx="1.5" ry="2" fill="#fff" class="eye-shine right-shine"/>
                <!-- 鼻子 -->
                <polygon points="60,48 57,52 63,52" fill="#ff3366" class="nose"/>
                <!-- 嘴巴 -->
                <path d="M60 52 Q55 58 50 55" stroke="#333" stroke-width="2" fill="none" class="mouth left-mouth"/>
                <path d="M60 52 Q65 58 70 55" stroke="#333" stroke-width="2" fill="none" class="mouth right-mouth"/>
                <!-- 胡须 -->
                <line x1="35" y1="45" x2="25" y2="43" stroke="#333" stroke-width="1.5" class="whisker"/>
                <line x1="35" y1="50" x2="25" y2="50" stroke="#333" stroke-width="1.5" class="whisker"/>
                <line x1="85" y1="45" x2="95" y2="43" stroke="#333" stroke-width="1.5" class="whisker"/>
                <line x1="85" y1="50" x2="95" y2="50" stroke="#333" stroke-width="1.5" class="whisker"/>
                <!-- 尾巴 -->
                <path d="M25 75 Q15 65 20 50 Q25 35 35 45" stroke="#ff6b6b" stroke-width="8" fill="none" class="tail"/>
            </svg>

            <!-- 小狗 SVG -->
            <svg id="dog-pet" class="pet-svg pet-dog" viewBox="0 0 120 120" style="display: none;">
                <!-- 身体 -->
                <ellipse cx="60" cy="75" rx="35" ry="30" fill="#ffa500" class="pet-body-svg"/>
                <!-- 头部 -->
                <ellipse cx="60" cy="45" rx="28" ry="25" fill="#ffa500" class="pet-head"/>
                <!-- 耳朵 -->
                <ellipse cx="45" cy="30" rx="8" ry="18" fill="#ff8c00" class="ear left-ear"/>
                <ellipse cx="75" cy="30" rx="8" ry="18" fill="#ff8c00" class="ear right-ear"/>
                <!-- 眼睛 -->
                <circle cx="52" cy="40" r="5" fill="#333" class="eye left-eye"/>
                <circle cx="68" cy="40" r="5" fill="#333" class="eye right-eye"/>
                <circle cx="54" cy="38" r="2" fill="#fff" class="eye-shine left-shine"/>
                <circle cx="70" cy="38" r="2" fill="#fff" class="eye-shine right-shine"/>
                <!-- 鼻子 -->
                <ellipse cx="60" cy="52" rx="4" ry="3" fill="#333" class="nose"/>
                <!-- 嘴巴 -->
                <path d="M60 55 Q55 62 48 58" stroke="#333" stroke-width="2" fill="none" class="mouth left-mouth"/>
                <path d="M60 55 Q65 62 72 58" stroke="#333" stroke-width="2" fill="none" class="mouth right-mouth"/>
                <!-- 舌头 -->
                <ellipse cx="60" cy="62" rx="6" ry="4" fill="#ff69b4" class="tongue"/>
                <!-- 尾巴 -->
                <path d="M25 70 Q10 60 15 45 Q20 30 30 40" stroke="#ffa500" stroke-width="10" fill="none" class="tail"/>
            </svg>

            <!-- 兔子 SVG -->
            <svg id="rabbit-pet" class="pet-svg pet-rabbit" viewBox="0 0 120 120" style="display: none;">
                <!-- 身体 -->
                <ellipse cx="60" cy="75" rx="32" ry="28" fill="#f0f0f0" class="pet-body-svg"/>
                <!-- 头部 -->
                <circle cx="60" cy="50" r="22" fill="#f0f0f0" class="pet-head"/>
                <!-- 耳朵 -->
                <ellipse cx="50" cy="25" rx="6" ry="20" fill="#f0f0f0" class="ear left-ear"/>
                <ellipse cx="70" cy="25" rx="6" ry="20" fill="#f0f0f0" class="ear right-ear"/>
                <ellipse cx="50" cy="25" rx="3" ry="15" fill="#ffb6c1" class="ear-inner left-ear-inner"/>
                <ellipse cx="70" cy="25" rx="3" ry="15" fill="#ffb6c1" class="ear-inner right-ear-inner"/>
                <!-- 眼睛 -->
                <circle cx="54" cy="45" r="4" fill="#333" class="eye left-eye"/>
                <circle cx="66" cy="45" r="4" fill="#333" class="eye right-eye"/>
                <circle cx="55" cy="43" r="1.5" fill="#fff" class="eye-shine left-shine"/>
                <circle cx="67" cy="43" r="1.5" fill="#fff" class="eye-shine right-shine"/>
                <!-- 鼻子 -->
                <ellipse cx="60" cy="52" rx="2" ry="1.5" fill="#ff69b4" class="nose"/>
                <!-- 嘴巴 -->
                <path d="M60 54 L58 58 L60 56 L62 58 Z" fill="#333" class="mouth"/>
                <!-- 胡须 -->
                <line x1="40" y1="50" x2="30" y2="48" stroke="#333" stroke-width="1" class="whisker"/>
                <line x1="40" y1="54" x2="30" y2="54" stroke="#333" stroke-width="1" class="whisker"/>
                <line x1="80" y1="50" x2="90" y2="48" stroke="#333" stroke-width="1" class="whisker"/>
                <line x1="80" y1="54" x2="90" y2="54" stroke="#333" stroke-width="1" class="whisker"/>
                <!-- 尾巴 -->
                <circle cx="28" cy="75" r="8" fill="#f0f0f0" class="tail"/>
            </svg>

            <!-- 小羊 SVG -->
            <svg id="sheep-pet" class="pet-svg pet-sheep" viewBox="0 0 120 120" style="display: none;">
                <!-- 身体 (毛茸茸的) -->
                <circle cx="45" cy="70" r="12" fill="#f8f8ff" class="wool wool-1"/>
                <circle cx="60" cy="65" r="15" fill="#f8f8ff" class="wool wool-2"/>
                <circle cx="75" cy="70" r="12" fill="#f8f8ff" class="wool wool-3"/>
                <circle cx="50" cy="80" r="10" fill="#f8f8ff" class="wool wool-4"/>
                <circle cx="70" cy="80" r="10" fill="#f8f8ff" class="wool wool-5"/>
                <ellipse cx="60" cy="75" rx="30" ry="25" fill="#f8f8ff" class="pet-body-svg"/>
                <!-- 头部 -->
                <ellipse cx="60" cy="45" rx="20" ry="18" fill="#ffb6c1" class="pet-head"/>
                <!-- 头上的毛 -->
                <circle cx="50" cy="35" r="8" fill="#f8f8ff" class="wool head-wool-1"/>
                <circle cx="60" cy="30" r="10" fill="#f8f8ff" class="wool head-wool-2"/>
                <circle cx="70" cy="35" r="8" fill="#f8f8ff" class="wool head-wool-3"/>
                <!-- 耳朵 -->
                <ellipse cx="48" cy="40" rx="4" ry="8" fill="#ffb6c1" class="ear left-ear"/>
                <ellipse cx="72" cy="40" rx="4" ry="8" fill="#ffb6c1" class="ear right-ear"/>
                <!-- 眼睛 -->
                <circle cx="55" cy="42" r="3" fill="#333" class="eye left-eye"/>
                <circle cx="65" cy="42" r="3" fill="#333" class="eye right-eye"/>
                <circle cx="56" cy="41" r="1" fill="#fff" class="eye-shine left-shine"/>
                <circle cx="66" cy="41" r="1" fill="#fff" class="eye-shine right-shine"/>
                <!-- 鼻子 -->
                <ellipse cx="60" cy="48" rx="2" ry="1.5" fill="#333" class="nose"/>
                <!-- 嘴巴 -->
                <path d="M60 50 Q58 53 56 51" stroke="#333" stroke-width="1.5" fill="none" class="mouth left-mouth"/>
                <path d="M60 50 Q62 53 64 51" stroke="#333" stroke-width="1.5" fill="none" class="mouth right-mouth"/>
                <!-- 腿 -->
                <rect x="48" y="95" width="4" height="12" fill="#333" class="leg leg-1"/>
                <rect x="56" y="95" width="4" height="12" fill="#333" class="leg leg-2"/>
                <rect x="64" y="95" width="4" height="12" fill="#333" class="leg leg-3"/>
                <rect x="72" y="95" width="4" height="12" fill="#333" class="leg leg-4"/>
                <!-- 尾巴 -->
                <circle cx="30" cy="75" r="6" fill="#f8f8ff" class="tail"/>
            </svg>

            <!-- 猫头鹰 SVG -->
            <svg id="owl-pet" class="pet-svg pet-owl" viewBox="0 0 120 120" style="display: none;">
                <!-- 身体 -->
                <ellipse cx="60" cy="70" rx="28" ry="35" fill="#8B4513" class="pet-body-svg"/>
                <!-- 胸部羽毛 -->
                <ellipse cx="60" cy="70" rx="20" ry="25" fill="#DEB887" class="chest-feathers"/>
                <!-- 头部 -->
                <circle cx="60" cy="40" r="25" fill="#8B4513" class="pet-head"/>
                <!-- 耳朵羽毛 -->
                <polygon points="45,20 40,5 50,15" fill="#8B4513" class="ear-tuft left-tuft"/>
                <polygon points="75,20 80,5 70,15" fill="#8B4513" class="ear-tuft right-tuft"/>
                <!-- 面盘 -->
                <circle cx="60" cy="40" r="18" fill="#DEB887" class="face-disc"/>
                <!-- 眼睛 (大眼睛) -->
                <circle cx="52" cy="38" r="8" fill="#fff" class="eye-white left-eye-white"/>
                <circle cx="68" cy="38" r="8" fill="#fff" class="eye-white right-eye-white"/>
                <circle cx="52" cy="38" r="6" fill="#FFD700" class="eye-iris left-iris"/>
                <circle cx="68" cy="38" r="6" fill="#FFD700" class="eye-iris right-iris"/>
                <circle cx="52" cy="38" r="3" fill="#333" class="eye left-eye"/>
                <circle cx="68" cy="38" r="3" fill="#333" class="eye right-eye"/>
                <circle cx="53" cy="37" r="1" fill="#fff" class="eye-shine left-shine"/>
                <circle cx="69" cy="37" r="1" fill="#fff" class="eye-shine right-shine"/>
                <!-- 喙 -->
                <polygon points="60,45 55,52 65,52" fill="#FFA500" class="beak"/>
                <!-- 翅膀 -->
                <ellipse cx="40" cy="65" rx="12" ry="20" fill="#654321" class="wing left-wing"/>
                <ellipse cx="80" cy="65" rx="12" ry="20" fill="#654321" class="wing right-wing"/>
                <!-- 翅膀纹理 -->
                <ellipse cx="40" cy="65" rx="8" ry="15" fill="#8B4513" class="wing-pattern left-pattern"/>
                <ellipse cx="80" cy="65" rx="8" ry="15" fill="#8B4513" class="wing-pattern right-pattern"/>
                <!-- 爪子 -->
                <polygon points="52,100 48,108 52,106 56,108" fill="#333" class="claw left-claw"/>
                <polygon points="68,100 64,108 68,106 72,108" fill="#333" class="claw right-claw"/>
                <!-- 尾巴羽毛 -->
                <ellipse cx="60" cy="95" rx="15" ry="8" fill="#654321" class="tail"/>
            </svg>
        </div>
        
        <!-- 状态显示 -->
        <div id="status-display" class="status-display hidden">
            <div class="status-item">
                <span class="status-label">精力:</span>
                <div class="status-bar">
                    <div class="status-fill energy-fill"></div>
                </div>
                <span class="status-value energy-value">100</span>
            </div>
            <div class="status-item">
                <span class="status-label">饥饿:</span>
                <div class="status-bar">
                    <div class="status-fill hunger-fill"></div>
                </div>
                <span class="status-value hunger-value">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">心情:</span>
                <span class="mood-indicator">😊</span>
            </div>
        </div>
        
        <!-- 天气显示 -->
        <div id="weather-display" class="weather-display hidden">
            <div class="weather-icon" id="weatherIcon">☀️</div>
            <div class="weather-info">
                <div class="weather-temp" id="weatherTemp">25°C</div>
                <div class="weather-desc" id="weatherDesc">晴天</div>
            </div>
        </div>
        
        <!-- 右键菜单 -->
        <div id="context-menu" class="context-menu hidden">
            <div class="menu-item" data-action="feed">🍎 喂食</div>
            <div class="menu-item" data-action="play">🎾 玩耍</div>
            <div class="menu-item" data-action="sleep">😴 睡觉</div>
            <div class="menu-item" data-action="status">📊 状态</div>
            <div class="menu-item" data-action="weather">🌤️ 天气</div>
            <div class="menu-item" data-action="settings">⚙️ 设置</div>
            <div class="menu-item" data-action="hide">👋 再见</div>
        </div>
    </div>
    
    <script src="pet.js"></script>
</body>
</html>
